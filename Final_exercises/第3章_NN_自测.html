<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>第3章 NN 自测</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* === Quiz Creator Shared Styles === */
/* Paper-like warm background, clean typography, responsive */

:root {
  --paper: #f5f7fa;
  --paper-dark: #e8ecf1;
  --ink: #2c2c2c;
  --ink-light: #555;
  --accent: #1a5276;
  --accent-hover: #0d3b5c;
  --divider: #d0d7de;
  --card-bg: #fff;
  --card-border: #dfe3e8;
  --correct: #27ae60;
  --correct-bg: #f0fdf4;
  --wrong: #c0392b;
  --wrong-bg: #fef2f2;
  --tag-bg: #fdebd0;
  --tag-text: #935116;
  --radius: 6px;
  --shadow: 0 1px 4px rgba(0,0,0,.08);
}

* { box-sizing: border-box; }

body {
  font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif;
  font-size: 12pt; line-height: 1.75; color: var(--ink);
  max-width: 860px; margin: auto; padding: 24px 20px 60px;
  background: var(--paper);
}

@media print {
  body { font-size: 10.5pt; background: #fff; }
  .no-print { display: none !important; }
  h1, h2, h3 { page-break-after: avoid; }
}

/* ── Header ── */
#qc-header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0; margin-bottom: 0;
}
.header-brand { font-size: 1.2em; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
.header-url  { font-size: 0.78em; color: #999; }
.header-divider { border: none; border-top: 2px solid var(--divider); margin: 4px 0 20px 0; }

/* ── Typography ── */
h1 { font-size: 1.5em; text-align: center; margin: 0 0 4px 0; }
h2 { font-size: 1.2em; color: var(--ink); margin: 20px 0 8px; }
h3 { font-size: 1.05em; margin-top: 18px; color: var(--ink); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Tables ── */
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.95em; }
td, th { border: 1px solid var(--card-border); padding: 5px 9px; text-align: left; }
th { background: var(--paper-dark); font-weight: 700; }

/* ── Knowledge point vs explanation ── */
.kp { font-weight: 700; color: var(--ink); }
.exp { font-weight: 400; color: var(--ink-light); }
.exp em, .exp strong { color: var(--ink); }

/* ── Block elements ── */
blockquote {
  border-left: 3px solid #c0392b; background: #fef9ef;
  padding: 6px 14px; margin: 10px 0; font-size: 0.95em;
}
code { background: #f0ede0; padding: 2px 5px; border-radius: 3px; font-size: 0.92em; }
pre { background: #1e1e2e; color: #e0e0e0; padding: 10px; border-radius: var(--radius); overflow-x: auto; }
pre code { background: transparent; color: inherit; padding: 0; }

/* ── Progress bar ── */
.progress-bar { height: 6px; background: #ddd; border-radius: 3px; margin: 12px 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; border-radius: 3px; }

/* ── Priority tags ── */
.tag-must   { background: #fee2e2; color: #991b1b; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }
.tag-key    { background: #fef3c7; color: #92400e; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }
.tag-freq   { background: #dbeafe; color: #1e40af; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }
.tag-info   { background: #f0fdf4; color: #166534; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }

/* === Quiz Creator — Interactive Test Styles === */

/* ── Score box ── */
#score-box {
  display: none; background: var(--card-bg); color: var(--ink);
  padding: 16px 20px; border-radius: var(--radius); margin: 14px 0;
  text-align: center; border: 1px solid var(--card-border); box-shadow: var(--shadow);
}
#score-box .score-num { font-size: 2.2em; font-weight: 700; color: var(--accent); }
#score-box .score-label { font-size: 0.85em; color: var(--ink-light); }
#score-box .score-detail { margin: 6px 0; font-size: 0.9em; color: var(--ink-light); }

/* ── Weak KPs ── */
#weak-section { display: none; margin-top: 10px; }
#weak-section strong { font-size: 0.9em; }
.kp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; justify-content: center; }
.kp-tag { background: var(--tag-bg); color: var(--tag-text); padding: 3px 12px; border-radius: 12px; font-size: 0.82em; }

/* ── Question card ── */
.q-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 14px 16px; margin: 10px 0;
  box-shadow: var(--shadow); transition: all 0.15s;
  border-left: 4px solid transparent;
}
.q-card.correct { border-left-color: var(--correct); background: var(--correct-bg); }
.q-card.wrong   { border-left-color: var(--wrong); background: var(--wrong-bg); }

.q-num  { font-weight: 700; font-size: 0.95em; margin-bottom: 6px; color: var(--ink-light); }
.q-text { margin-bottom: 8px; font-size: 0.98em; line-height: 1.7; }
.q-text .kp-badge { font-size: 0.78em; color: var(--ink-light); margin-left: 8px; }

/* ── Options ── */
.option {
  display: block; padding: 5px 10px; margin: 4px 0;
  border: 1px solid var(--card-border); border-radius: 4px;
  cursor: pointer; transition: all 0.12s; font-size: 0.93em;
  background: #fefcf5;
}
.option:hover            { background: #f0ede0; }
.option input            { margin-right: 6px; }
.option.selected         { border-color: var(--accent); background: #eff6ff; }
.option.correct-answer   { border-color: var(--correct); background: var(--correct-bg); }
.option.wrong-answer     { border-color: var(--wrong); background: var(--wrong-bg); }

/* ── Textareas (for short/code) ── */
.q-textarea {
  width: 100%; min-height: 56px; border: 1px solid var(--card-border);
  border-radius: 4px; padding: 6px 10px; font-family: inherit;
  font-size: 0.93em; background: #fefcf5; resize: vertical;
}
.q-textarea:focus { outline: none; border-color: var(--accent); }
.q-code {
  font-family: "Consolas", "Monaco", "Courier New", monospace;
  font-size: 0.88em; line-height: 1.5; background: #1e1e2e; color: #e0e0e0;
  tab-size: 4; white-space: pre;
}
.q-code:focus { border-color: var(--accent); }

/* ── Fill input ── */
.fill-input {
  width: 120px; padding: 3px 8px; border: 1px solid var(--card-border);
  border-radius: 3px; font-size: 0.95em; text-align: center; background: #fff;
}
.fill-input:focus { outline: none; border-color: var(--accent); }
.fill-input.fill-ok { border-color: var(--correct); background: var(--correct-bg); }
.fill-input.fill-no { border-color: var(--wrong); background: var(--wrong-bg); }
.fill-row { margin: 6px 0; }
.fill-tag { font-weight: 600; margin-right: 4px; font-size: 0.9em; }

/* ── Partial-credit card ── */
.q-card.partial { border-color: #f59e0b; }
.badge-partial { background: #fef3c7; color: #92400e; }

/* ── Result after grading ── */
.result {
  display: none; margin-top: 8px; padding: 8px 12px;
  background: #fefcf5; border: 1px solid var(--card-border);
  border-radius: 4px; font-size: 0.9em; line-height: 1.6;
}
.result .badge {
  display: inline-block; padding: 1px 9px; border-radius: 3px;
  font-weight: 700; font-size: 0.82em; margin-right: 6px;
}
.badge-ok  { background: var(--correct-bg); color: #166534; }
.badge-no  { background: var(--wrong-bg); color: #991b1b; }
.badge-ref { background: #dbeafe; color: #1e40af; }

.result .explanation { margin-top: 4px; color: var(--ink); }
.result .pitfall { color: #b45309; margin-top: 3px; font-size: 0.9em; }

/* ── Grading bar ── */
.grading-bar { text-align: center; margin: 16px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.grading-bar button {
  font-size: 0.95em; padding: 8px 24px; background: var(--accent);
  color: #fff; border: none; border-radius: var(--radius);
  cursor: pointer; font-weight: 600; letter-spacing: 0.3px;
}
.grading-bar button:hover     { background: var(--accent-hover); }
.grading-bar button:disabled  { background: #bbb; cursor: not-allowed; }
.grading-bar .btn-secondary   { background: #7f8c8d; }
.grading-bar .btn-secondary:hover { background: #6b7a7b; }
.grading-bar .btn-warning     { background: #e67e22; }
.grading-bar .btn-warning:hover   { background: #c96d1c; }

/* ── Log status ── */
#logStatus { font-size: 0.85em; margin-top: 4px; text-align: center; color: var(--ink-light); }

/* ── Print ── */
.no-print { }

</style>
</head>

<header id="qc-header">
  <div class="header-left"><span class="header-brand">Quiz Creator</span></div>

<h1>第3章 NN 自测</h1>
<p style="text-align:center;color:var(--ink-light);font-size:0.95em">满分 49 分 | 建议 30 分钟</p>

<div class="progress-bar no-print"><div class="progress-fill" id="progressFill"></div></div>

<script>
var Q = [{"type": "mcq", "points": 3, "question": "网络前向传播中，某个隐藏层神经元收到的加权输入 z = -2。经过 ReLU 后它的输出是多少？这说明了 ReLU 的什么特性？<pre><code class=\"lang-python\"># 网络：输入(4节点) → 隐藏(8节点,ReLU) → 输出(3节点,Softmax)\nz = -2  # 某神经元的加权输入</code></pre>", "options": ["输出 0 — ReLU 将负数映射为 0，即稀疏激活特性", "输出 -2 — ReLU 保持所有输入不变", "输出 2 — ReLU 会对负数取绝对值", "输出 0.12 — 套用 Sigmoid 公式计算的结果"], "answer": 0, "kp": ["forward-prop", "activation-relu", "activation-why"], "explanation": "ReLU = max(0, x)，z=-2时输出0。正是这种特性让ReLU引入非线性——仅激活正信号，抑制负信号。", "id": "S1"}, {"type": "fill", "points": 3, "question": "<pre><code class=\"lang-python\">inputs=[3,-1,2]\nweights=[0.5,-2,1.5]\nbias=1\nz=sum(i*w for i,w in zip(inputs,weights))+bias\na=max(0,z) # ReLU</code></pre>\nz=<input class=\"fill-inline\" data-idx=\"0\">, a=<input class=\"fill-inline\" data-idx=\"1\">", "answer": [["7.5", "7.5"], ["7.5", "7.5"]], "kp": ["forward-prop", "activation-relu"], "explanation": "z=3x0.5+(-1)x(-2)+2x1.5+1=1.5+2+3+1=7.5。ReLU(7.5)=7.5。", "id": "S2"}, {"type": "mcq", "points": 3, "question": "一个 4 分类任务，Softmax 输出的概率分布是 [0.7, 0.1, 0.1, 0.1]，真实标签是第 1 类（One-Hot 为 [1,0,0,0]）。交叉熵损失 L 是多少？这个值说明了什么？", "options": ["0.36，模型对第 1 类有 70% 置信度，还可提升", "-0.36 — 交叉熵损失不可能为负值", "0.7 — 损失值等于正确类别的预测概率", "0.36，但交叉熵越小说明模型越差"], "answer": 0, "kp": ["cross-entropy", "softmax", "one-hot"], "explanation": "L=-log(0.7)=0.36。交叉熵越小越好,0.36表明70%置信度。", "id": "S3"}, {"type": "mcq", "points": 3, "question": "训练过程中，损失曲线一直在剧烈震荡，几乎不下降。最可能的原因是什么？", "options": ["学习率太大——梯度下降跳过谷底，在对侧壁弹跳", "学习率太小——每步更新量极小，损失几乎不变", "过拟合——训练集损失也可能大幅震荡", "欠拟合——但欠拟合通常表现为损失平缓不下降"], "answer": 0, "kp": ["gradient-descent", "learning-rate"], "explanation": "学习率大->更新步长过大->跳过谷底->弹跳。应降低学习率。", "id": "S4"}, {"type": "mcq", "points": 3, "question": "模型在训练集上准确率高达 99.8%，但测试集只有 82%。最有效的改进措施是什么？", "options": ["增加网络层数——更深的网络能更好地拟合训练数据", "降低模型复杂度 + 数据增强——缓解过拟合最有效", "增大学习率——加速训练，防止训练不充分", "减少训练数据——减轻模型负担，降低过拟合风险"], "answer": 1, "kp": ["overfitting", "dataset-split"], "explanation": "训练高测试低=过拟合。应降低复杂度或增加数据/数据增强。", "id": "  3, "question": "训练集960样本,batch=32,10000次iteration约<input class=\"fill-inline\" data-idx=\"0\"> epoch。\n每epoch=960/32=30, epoch=10000/30≈<input class=\"fill-inline\" data-idx=\"1\">。", "answer": [["333", "333.3"], ["333", "333.3"]], "kp": ["batch", "epoch", "iteration"], "explanation": "10000/30=333.3,约333个完整epoch。", "id": "S12"}, {"type": "mcq", "points": 3, "question": "关于训练集、验证集、测试集的划分，下面哪个说法是正确的？", "options": ["验证集训练中不可见，与测试集角色相同", "测试集可反复用于调参和模型选择", "验证集用于调参/选模型，测试集仅用于最终评估", "训练集、验证集、测试集三者没有本质区别"], "answer": 2, "kp": ["dataset-split", "overfitting", "underfitting"], "explanation": "训练集->训练;验证集->调参/选模型(训练中可见);测试集->最终评估(不可见)。", "id": "S13"}, {"type": "mcq", "points": 3, "question": "正确类别预测概率0.95时交叉熵损失约多少?", "options": ["0.05,模型很准", "0.95,损失=概率", "-0.95", "0.05,越小越差"], "answer": 0, "kp": ["cross-entropy", "softmax"], "explanation": "L=-log(0.95)=0.051。交叉熵越小->正确类别概率越高->越准。", "id": "S14"}, {"type": "tf", "points": 2, "question": "增大batch_size加速单次iteration,但可能降低模型泛化能力。", "answer": true, "kp": ["batch", "iteration"], "explanation": "大batch->梯度估计更平滑->收敛到尖锐极小值->泛化下降。", "id": "S15"}, {"type": "mcq", "points": 3, "question": "利用链式法则计算反向传播中的梯度。<pre><code class=\"lang-python\"># L = 0.5*(y_pred - y_true)^2, y_pred = wx + b\n# dL/dw = ?</code></pre>", "options": ["(y_pred-y_true)*x", "(y_pred-y_true)", "y_pred-y_true*w", "x*w"], "answer": 0, "kp": ["backprop", "mse-loss"], "explanation": "dL/dw=dL/dy_pred * dy_pred/dw = (y_pred-y_true)*x。链式法则。", "id": "S16"}, {"type": "mcq", "points": 3, "question": "训练过程中，某神经网络的 loss 从 0.7 降到了 0.05。以下推断正确的是？", "options": ["模型变好了——正确类别的预测概率从约 0.5 升至约 0.95", "模型变差了——loss 降低说明模型变得更差", "loss 变了但准确率不会随之变化", "过拟合——loss 降低接近 0 即过拟合信号"], "answer": 0, "kp": ["cross-entropy", "backprop"], "explanation": "L=-log(p),p=e^(-L)。L从0.7降到0.05意味着p从0.5升到0.95。", "id": "S17"}];

// ─── Answer normalization ──────────────────────────────────────────
// tf / mcq answers may arrive as int, boolean, letter ("A"),
// or label string ("正确"/"错误"/"对"/"错"). All are coerced to an
// option index so grading never silently fails on a type mismatch.

function tfAnswerIndex(ans) {
  if (typeof ans === 'boolean') return ans ? 0 : 1;
  if (typeof ans === 'number') return ans === 0 ? 0 : 1;
  var s = ('' + ans).trim().toLowerCase();
  var truthy = ['0', 't', 'true', '正确', '对', '是', 'yes', 'y', '√', '✓'];
  var falsy  = ['1', 'f', 'false', '错误', '错', '否', 'no', 'n', '×', 'x'];
  if (truthy.indexOf(s) !== -1) return 0;
  if (falsy.indexOf(s) !== -1) return 1;
  return ans ? 0 : 1;
}

function choiceAnswerIndex(ans, options) {
  if (typeof ans === 'number') return ans;
  var s = ('' + ans).trim();
  if (/^[A-Za-z]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (options) {
    for (var i = 0; i < options.length; i++) {
      if (('' + options[i]).trim() === s) return i;
    }
  }
  return parseInt(s, 10);
}

function multiAnswerSet(ans, options) {
  var arr = Array.isArray(ans) ? ans : [ans];
  var set = {};
  for (var i = 0; i < arr.length; i++) {
    set[choiceAnswerIndex(arr[i], options)] = true;
  }
  return set;
}

function normText(s) {
  s = ('' + s).trim().toLowerCase();
  s = s.replace(/[\s　]+/g, '');
  s = s.replace(/[.,;:!?。，、；：！？“”"'（）()【】\[\]<>《》]/g, '');
  s = s.replace(/[！-～]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
  });
  return s;
}

function fillBlankCount(question) {
  var m = ('' + question).match(/(_{2,}|＿+)/g);
  return m ? m.length : 0;
}

function fillBlankAnswers(ans, nBlanks) {
  if (nBlanks < 1) nBlanks = 1;
  if (!Array.isArray(ans)) return padBlanks([[ans]], nBlanks);
  if (ans.length && Array.isArray(ans[0])) return padBlanks(ans, nBlanks);
  if (nBlanks === 1) return [ans];
  if (ans.length === nBlanks) {
    return ans.map(function (a) { return [a]; });
  }
  return padBlanks([ans], nBlanks);
}

function padBlanks(arr, n) {
  var out = arr.slice(0, n);
  while (out.length < n) out.push(['']);
  return out;
}

// ─── Render fill inputs ────────────────────────────────────────────

function renderFill(q, qid) {
  var nBlanks = fillBlankCount(q.question);
  var k = 0;
  var html = ('' + q.question).replace(/(_{2,}|＿+)/g, function () {
    var inp = '<input type="text" class="fill-input" id="fill-' + qid + '-' + k + '" autocomplete="off" spellcheck="false">';
    k++;
    return inp;
  });
  if (k === 0) {
    // No markers in text -> append boxes based on answer shape
    var n = fillBlankAnswers(q.answer, 1).length;
    var ans = q.answer;
    if (Array.isArray(ans)) n = Array.isArray(ans[0]) ? ans.length : (ans.length || 1);
    if (n < 1) n = 1;
    html += '<div class="fill-row">';
    for (var b = 0; b < n; b++) {
      if (n > 1) html += '<span class="fill-tag">' + (b + 1) + '.</span>';
      html += '<input type="text" class="fill-input" id="fill-' + qid + '-' + b + '" autocomplete="off" spellcheck="false">';
    }
    html += '</div>';
  }
  return html;
}

// ─── Build ─────────────────────────────────────────────────────────

function build() {
  var container = document.getElementById('questions-container');
  if (!container) { console.error('Quiz Creator: questions-container not found'); return; }

  var order = LABELS.section_order || [];
  Q.forEach(function (q, i) { q._i = i; });
  Q.sort(function (a, b) {
    var oa = order.indexOf(a.type); if (oa === -1) oa = 99;
    var ob = order.indexOf(b.type); if (ob === -1) ob = 99;
    return oa - ob || a._i - b._i;
  });

  var h = '';
  var sec = '';
  var titles = LABELS.section;

  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    if (q.type !== sec) {
      sec = q.type;
      if (titles[q.type]) h += '<h2>' + titles[q.type] + '</h2>';
    }

    var qid = 'q' + i;
    var pts = q.points || 2;
    h += '<div class="q-card" id="card-' + qid + '">';
    h += '<div class="q-num">' + (i + 1) + '. (' + pts + ' ' + LABELS.points_suffix + ')</div>';

    // Question text — fill needs renderFill() to replace ____ with inputs
    if (q.type === 'fill') {
      h += '<div class="q-text">' + renderFill(q, qid);
    } else {
      h += '<div class="q-text">' + q.question;
    }
    if (q.kp && q.kp.length) {
      h += ' <span class="kp-badge">' + LABELS.kp_prefix + q.kp.join(', ') + '</span>';
    }
    h += '</div>';

    if (q.type === 'mcq' || q.type === 'choice') {
      var opts = q.options || [];
      for (var j = 0; j < opts.length; j++) {
        h += '<label class="option" id="opt-' + qid + '-' + j + '" onclick="sel(\'' + qid + '\',' + j + ')">';
        h += '<input type="radio" name="' + qid + '" value="' + j + '">' + String.fromCharCode(65 + j) + '. ' + opts[j] + '</label>';
      }
    } else if (q.type === 'multi') {
      var mopts = q.options || [];
      for (var k = 0; k < mopts.length; k++) {
        h += '<label class="option" id="opt-' + qid + '-' + k + '" onclick="toggle(\'' + qid + '\',' + k + ')">';
        h += '<input type="checkbox" name="' + qid + '" value="' + k + '">' + String.fromCharCode(65 + k) + '. ' + mopts[k] + '</label>';
      }
    } else if (q.type === 'tf') {
      h += '<label class="option" id="opt-' + qid + '-0" onclick="sel(\'' + qid + '\',0)">';
      h += '<input type="radio" name="' + qid + '" value="0">' + LABELS.true_label + '</label>';
      h += '<label class="option" id="opt-' + qid + '-1" onclick="sel(\'' + qid + '\',1)">';
      h += '<input type="radio" name="' + qid + '" value="1">' + LABELS.false_label + '</label>';
    } else if (q.type === 'code') {
      h += '<textarea class="q-textarea q-code" id="text-' + qid + '" placeholder="' + (LABELS.code_placeholder) + '" rows="8" spellcheck="false"></textarea>';
    } else {
      h += '<textarea class="q-textarea" id="text-' + qid + '" placeholder="' + LABELS.placeholder + '" rows="3"></textarea>';
    }

    h += '<div class="result" id="result-' + qid + '">';
    h += '<span class="badge" id="badge-' + qid + '"></span><span id="correct-' + qid + '"></span>';
    h += '<div class="explanation">' + (q.explanation || '') + '</div>';
    if (q.pitfall) {
      h += '<div class="pitfall">' + LABELS.pitfall_prefix + q.pitfall + '</div>';
    }
    h += '</div></div>';
  }

  container.innerHTML = h;
  renderMath();
}

// ─── Selection handlers ────────────────────────────────────────────

function sel(qid, idx) {
  var prefix = 'opt-' + qid + '-';
  var all = document.querySelectorAll('[id^="' + prefix + '"]');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
  var target = document.getElementById('opt-' + qid + '-' + idx);
  if (target) target.classList.add('selected');
  var radio = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  if (radio) radio.checked = true;
  updateProgress();
}

function toggle(qid, idx) {
  var box = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  var label = document.getElementById('opt-' + qid + '-' + idx);
  if (!box) return;
  box.checked = !box.checked;
  if (label) label.classList.toggle('selected', box.checked);
  updateProgress();
}

function onFillInput(qid) {
  updateProgress();
}

// ─── Progress ──────────────────────────────────────────────────────

function updateProgress() {
  var answered = 0;
  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    var qid = 'q' + i;
    if (q.type === 'tf' || q.type === 'mcq' || q.type === 'choice') {
      var sel = document.querySelector('input[name="' + qid + '"]:checked');
      if (sel) answered++;
    } else if (q.type === 'multi') {
      var checks = document.querySelectorAll('input[name="' + qid + '"]:checked');
      if (checks.length > 0) answered++;
    } else if (q.type === 'fill') {
      var inputs = document.querySelectorAll('#card-' + qid + ' .fill-input');
      var any = false;
      for (var f = 0; f < inputs.length; f++) { if (inputs[f].value.trim()) { any = true; break; } }
      if (any) answered++;
    } else {
      var ta = document.getElementById('text-' + qid);
      if (ta && ta.value.trim()) answered++;
    }
  }
  var pct = Q.length > 0 ? (answered / Q.length) * 100 : 0;
  var bar = document.getElementById('progressFill');
  if (bar) bar.style.width = pct + '%';
}

// ─── Grading ───────────────────────────────────────────────────────

function gradeAll() {
  var score = 0, maxScore = 0, correctCount = 0, wrongCount = 0;
  var weakKPs = {}, wrongItems = [];

  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    var pts = q.points || 2;
    maxScore += pts;
    var qid = 'q' + i;
    var card = document.getElementById('card-' + qid);
    var result = document.getElementById('result-' + qid);
    var badge = document.getElementById('badge-' + qid);
    var correctEl = document.getElementById('correct-' + qid);
    if (!card || !result) continue;

    result.style.display = 'block';

    var earned = 0;
    if (q.type === 'mcq' || q.type === 'choice' || q.type === 'tf') {
      earned = gradeSingle(q, qid, card, badge, correctEl, pts);
    } else if (q.type === 'multi') {
      earned = gradeMulti(q, qid, card, badge, correctEl, pts);
    } else if (q.type === 'fill') {
      earned = gradeFill(q, qid, card, badge, correctEl, pts);
    } else {
      card.classList.add('correct');
      badge.className = 'badge badge-ref';
      badge.textContent = LABELS.reference_label;
    }

    score += earned;
    if (earned >= pts) { correctCount++; }
    else if (earned > 0) { /* partial — counted in wrong */ wrongCount++; }
    else { wrongCount++; wrongItems.push({ id: q.id || qid, kp: q.kp }); }

    if (q.kp && earned < pts) {
      for (var k = 0; k < q.kp.length; k++) {
        weakKPs[q.kp[k]] = (weakKPs[q.kp[k]] || 0) + 1;
      }
    }

    // Disable inputs
    disableCardInputs(card);
  }

  // Score panel
  var sb = document.getElementById('score-box');
  if (sb) {
    sb.style.display = 'block';
    document.getElementById('score-num').textContent = roundScore(score);
    document.getElementById('score-max').textContent = maxScore;
    document.getElementById('correct-count').textContent = correctCount;
    document.getElementById('wrong-count').textContent = wrongCount;

    // Weak KPs
    var ws = document.getElementById('weak-section');
    if (ws && Object.keys(weakKPs).length > 0) {
      ws.style.display = 'block';
      var tags = document.getElementById('kp-tags');
      tags.innerHTML = Object.keys(weakKPs).sort(function (a, b) { return weakKPs[b] - weakKPs[a]; }).map(function (k) {
        return '<span class="kp-tag">' + k + ' (' + weakKPs[k] + ')</span>';
      }).join('');
    }

    sb.scrollIntoView({ behavior: 'smooth' });
  }

  // Buttons
  document.getElementById('grade-btn').disabled = true;
  document.getElementById('grade-btn').textContent = LABELS.graded_label;
  document.getElementById('btn-toggle').style.display = 'inline-block';
  document.getElementById('btn-reset').style.display = 'inline-block';
  if (wrongItems.length > 0) {
    document.getElementById('btn-export').style.display = 'inline-block';
  }

  // Save log
  window._lastLogEntry = {
    source: document.title || 'Quiz',
    quizId: document.title || 'quiz',
    date: new Date().toLocaleString('zh-CN'),
    score: roundScore(score), maxScore: maxScore,
    accuracy: maxScore > 0 ? roundScore(score / maxScore * 100) + '%' : '0%',
    wrongKPs: Object.keys(weakKPs), wrongCount: wrongCount,
    totalQuestions: Q.length, wrongItems: wrongItems
  };

  renderMath();
}

function roundScore(s) { return Math.round(s * 10) / 10; }

function disableCardInputs(card) {
  card.querySelectorAll('input').forEach(function (el) { el.disabled = true; });
  card.querySelectorAll('.fill-input').forEach(function (el) { el.disabled = true; });
  card.querySelectorAll('.q-textarea').forEach(function (el) { el.disabled = true; });
}

function gradeSingle(q, qid, card, badge, correctEl, pts) {
  var ansIdx = q.type === 'tf' ? tfAnswerIndex(q.answer) : choiceAnswerIndex(q.answer, q.options);
  var radio = document.querySelector('input[name="' + qid + '"]:checked');
  if (radio && parseInt(radio.value, 10) === ansIdx) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
    var ok = document.getElementById('opt-' + qid + '-' + ansIdx);
    if (ok) ok.classList.add('correct-answer');
    return pts;
  }
  card.classList.add('wrong');
  badge.className = 'badge badge-no';
  badge.textContent = LABELS.wrong_label;
  var ansText = (q.type === 'mcq' || q.type === 'choice')
    ? String.fromCharCode(65 + ansIdx) + '. ' + (q.options ? q.options[ansIdx] : '')
    : (ansIdx === 0 ? LABELS.true_label : LABELS.false_label);
  correctEl.innerHTML = LABELS.answer_prefix + ansText;
  if (radio) {
    var wrongOpt = document.getElementById('opt-' + qid + '-' + radio.value);
    if (wrongOpt) wrongOpt.classList.add('wrong-answer');
  }
  var corr = document.getElementById('opt-' + qid + '-' + ansIdx);
  if (corr) corr.classList.add('correct-answer');
  return 0;
}

function gradeMulti(q, qid, card, badge, correctEl, pts) {
  var want = multiAnswerSet(q.answer, q.options);
  var wantKeys = Object.keys(want).map(Number);
  var checked = document.querySelectorAll('input[name="' + qid + '"]:checked');
  var picked = [];
  for (var i = 0; i < checked.length; i++) picked.push(parseInt(checked[i].value, 10));

  var anyWrong = false, hitCorrect = 0;
  for (var p = 0; p < picked.length; p++) {
    if (want[picked[p]]) hitCorrect++;
    else anyWrong = true;
  }

  var mopts = q.options || [];
  for (var j = 0; j < mopts.length; j++) {
    var el = document.getElementById('opt-' + qid + '-' + j);
    if (!el) continue;
    if (want[j]) el.classList.add('correct-answer');
    else if (picked.indexOf(j) !== -1) el.classList.add('wrong-answer');
  }

  var earned;
  if (!anyWrong && hitCorrect === wantKeys.length && picked.length === wantKeys.length) {
    earned = pts;
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
  } else if (!anyWrong && hitCorrect > 0) {
    earned = roundScore(pts * hitCorrect / wantKeys.length);
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  } else {
    earned = 0;
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  }
  return earned;
}

function multiAnswerText(keys, options) {
  return keys.sort(function (a, b) { return a - b; }).map(function (k) {
    return String.fromCharCode(65 + k) + '. ' + (options ? options[k] : '');
  }).join('  ');
}

function gradeFill(q, qid, card, badge, correctEl, pts) {
  var nBlanks = fillBlankCount(q.question);
  var blanks = fillBlankAnswers(q.answer, nBlanks);
  var n = blanks.length;
  var hit = 0;
  var displays = [];

  for (var b = 0; b < n; b++) {
    var inp = document.getElementById('fill-' + qid + '-' + b);
    var accepted = blanks[b] || [''];
    var user = inp ? normText(inp.value) : '';
    var ok = false;
    for (var a = 0; a < accepted.length; a++) {
      if (accepted[a] !== '' && normText(accepted[a]) === user && user !== '') { ok = true; break; }
    }
    if (inp) inp.classList.add(ok ? 'fill-ok' : 'fill-no');
    if (ok) hit++;
    displays.push((n > 1 ? (b + 1) + '. ' : '') + accepted.filter(function (x) { return x !== ''; }).join(' / '));
  }

  var earned = roundScore(pts * hit / n);
  correctEl.innerHTML = LABELS.answer_prefix + displays.join('   ');

  if (hit === n) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
  } else if (hit > 0) {
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
  } else {
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
  }
  return earned;
}

// ─── UI Controls ───────────────────────────────────────────────────

function toggleExplanations() {
  var visible = document.getElementById('btn-toggle').getAttribute('data-visible') === 'true';
  var els = document.querySelectorAll('.result .explanation');
  for (var i = 0; i < els.length; i++) {
    els[i].style.display = visible ? 'none' : 'block';
  }
  document.getElementById('btn-toggle').textContent = visible ? LABELS.toggle_explanation : LABELS.hide_explanation;
  document.getElementById('btn-toggle').setAttribute('data-visible', visible ? 'false' : 'true');
}

function resetQuiz() {
  Q.forEach(function (q, i) {
    var qid = 'q' + i;
    var card = document.getElementById('card-' + qid);
    var result = document.getElementById('result-' + qid);
    if (card) { card.className = 'q-card'; }
    if (result) { result.style.display = 'none'; }
    card.querySelectorAll('input').forEach(function (el) { el.checked = false; el.disabled = false; });
    card.querySelectorAll('.fill-input').forEach(function (el) { el.value = ''; el.disabled = false; el.className = 'fill-input'; });
    card.querySelectorAll('.q-textarea').forEach(function (el) { el.value = ''; el.disabled = false; });
    card.querySelectorAll('.option').forEach(function (el) { el.className = 'option'; });
  });

  document.getElementById('score-box').style.display = 'none';
  document.getElementById('weak-section').style.display = 'none';
  document.getElementById('grade-btn').disabled = false;
  document.getElementById('grade-btn').textContent = LABELS.grade_button;
  document.getElementById('btn-toggle').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('btn-export').style.display = 'none';
  document.getElementById('logStatus').textContent = '';
  document.getElementById('progressFill').style.width = '0';
}

// ─── Log Export ────────────────────────────────────────────────────

var _dirHandle = null;
var LOG_FILENAME = LABELS.log_filename || '错题日志.json';
var DB_NAME = 'quizLogDB', DB_STORE = 'dirs', DB_KEY = 'logDir';

function idbOpen() {
  return new Promise(function (resolve, reject) {
    var r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = function () { r.result.createObjectStore(DB_STORE); };
    r.onsuccess = function () { resolve(r.result); };
    r.onerror = function () { reject(r.error); };
  });
}
function idbSave(h) {
  return idbOpen().then(function (db) {
    var tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(h, DB_KEY);
    return new Promise(function (res, rej) { tx.oncomplete = function () { db.close(); res(); }; tx.onerror = function () { db.close(); rej(tx.error); }; });
  });
}
function idbLoad() {
  return idbOpen().then(function (db) {
    var tx = db.transaction(DB_STORE, 'readonly');
    var r = tx.objectStore(DB_STORE).get(DB_KEY);
    return new Promise(function (res, rej) { r.onsuccess = function () { db.close(); res(r.result); }; r.onerror = function () { db.close(); rej(r.error); }; });
  });
}

function writeLogToDisk(entry) {
  return (idbLoad().then(function (handle) {
    _dirHandle = handle;
    if (_dirHandle) {
      var opts = { mode: 'readwrite' };
      return _dirHandle.queryPermission(opts).then(function (perm) {
        if (perm !== 'granted') {
          return _dirHandle.requestPermission(opts).then(function (p) { if (p !== 'granted') _dirHandle = null; return; });
        }
      });
    }
  }).then(function () {
    if (!_dirHandle) {
      return window.showDirectoryPicker().then(function (h) { _dirHandle = h; return idbSave(h); });
    }
  }).then(function () {
    return _dirHandle.getFileHandle(LOG_FILENAME, { create: true }).then(function (fh) {
      return fh.getFile().then(function (f) {
        var existing = [];
        if (f.size > 0) { return f.text().then(function (t) { try { existing = JSON.parse(t); if (!Array.isArray(existing)) existing = [existing]; } catch(e) {} return existing; }); }
        return existing;
      }).then(function (existing) {
        existing.push(entry);
        return fh.createWritable().then(function (w) { return w.write(JSON.stringify(existing, null, 2)).then(function () { return w.close(); }); });
      });
    });
  }));
}

function exportLog() {
  if (!window._lastLogEntry) return;
  var entry = window._lastLogEntry;
  if (!entry.source) entry.source = document.title || 'Quiz';

  if ('showDirectoryPicker' in window) {
    return writeLogToDisk(entry).then(function () {
      document.getElementById('logStatus').textContent = LABELS.log_saved_message + LOG_FILENAME;
    }).catch(function (e) {
      if (e.name === 'AbortError') return;
      _dirHandle = null;
      idbSave(null).catch(function () {});
      fallbackDownload(entry);
    });
  }
  fallbackDownload(entry);
}

function fallbackDownload(entry) {
  var blob = new Blob([JSON.stringify([entry], null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = LOG_FILENAME;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ─── KaTeX ─────────────────────────────────────────────────────────

function renderMath() {
  if (typeof renderMathInElement !== 'undefined') {
    try {
      renderMathInElement(document.getElementById('questions-container') || document.body, {
        delimiters: [
          { left: '\\(', right: '\\)', display: false },
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false }
        ]
      });
    } catch(e) { /* KaTeX may throw on isolated errors */ }
  } else {
    setTimeout(renderMath, 300);
  }
}

document.addEventListener('DOMContentLoaded', build);
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  build();
}

// Listen for fill input changes
document.addEventListener('input', function (e) {
  if (e.target.classList.contains('fill-input')) {
    var card = e.target.closest('.q-card');
    if (card) {
      var qid = card.id.replace('card-', '');
      onFillInput(qid);
    }
  }
});
