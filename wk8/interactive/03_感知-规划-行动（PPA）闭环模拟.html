<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPA Loop (Perceive-Plan-Act) Agent 模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #a78bfa;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas {
            touch-action: none;
            image-rendering: antialiased;
        }

        .control-panel {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
        }

        @media (max-width: 767.9px) {
            .control-panel {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: var(--primary);
            cursor: pointer;
            border-radius: 50%;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .loop-stage {
            transition: all 0.3s ease;
            opacity: 0.4;
            transform: scale(0.9);
        }

        .loop-stage.active {
            opacity: 1;
            transform: scale(1.1);
            color: var(--primary-light);
            font-weight: bold;
        }

        .log-container {
            font-family: 'Courier New', Courier, monospace;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .log-container::-webkit-scrollbar {
            width: 4px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: var(--primary);
        }

        @keyframes pulse-highlight {
            0%, 100% { outline-color: rgba(139, 92, 246, 0.8); }
            50% { outline-color: rgba(139, 92, 246, 0.4); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const katexOptions = {
        delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false,
        strict: false,
        trust: true
    };

    let renderTimeout;
    function safeRender() {
        if (renderTimeout) clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => {
            renderMathInElement(document.body, katexOptions);
        }, 100);
    }

    renderMathInElement(document.body, katexOptions);

    const observer = new MutationObserver((mutations) => {
        let shouldRender = false;
        mutations.forEach((mutation) => {
            if (mutation.target &&
                mutation.target.className &&
                typeof mutation.target.className === 'string' &&
                mutation.target.className.includes('katex')) {
                return;
            }
            shouldRender = true;
        });

        if (shouldRender) {
            safeRender();
        }
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });

    setInterval(() => {
        const text = document.body.innerText;
        if (text.includes('\\(') || text.includes('$$')) {
            safeRender();
        }
    }, 2000);
});
</script>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

<script type="application/json" id="widget-config">
{
  "type": "simulation",
  "concept": "perceive_plan_act_loop",
  "description": "演示 AI Agent 动态循环决策过程：感知、规划、行动。",
  "variables": [
    { "name": "environment_noise", "label": "环境噪声", "min": 0, "max": 100, "default": 20, "unit": "%" },
    { "name": "max_iterations", "label": "最大循环次数", "min": 5, "max": 50, "default": 20, "unit": "次" },
    { "name": "error_recovery_rate", "label": "纠错能力", "min": 0, "max": 100, "default": 80, "unit": "%" }
  ],
  "presets": [
    { "name": "高噪挑战", "variables": { "environment_noise": 70, "error_recovery_rate": 40 } },
    { "name": "理想Agent", "variables": { "environment_noise": 5, "error_recovery_rate": 95 } }
  ]
}
</script>

<!-- 左侧/顶部 控制面板 -->
<div id="controls" class="w-full md:w-80 shrink-0 flex flex-col max-h-[45vh] md:max-h-screen control-panel p-4 overflow-y-auto">
    <div class="mb-6">
        <h1 class="text-xl font-bold text-white mb-2 flex items-center">
            <span class="mr-2">🔄</span> PPA Loop 模拟
        </h1>
        <p class="text-xs text-slate-400 leading-relaxed">
            观察 Agent 如何通过 <b>Perceive</b> (感知), <b>Plan</b> (规划), <b>Act</b> (行动) 的循环来应对环境干扰。
        </p>
    </div>

    <!-- 变量调节 -->
    <div class="space-y-4 mb-6">
        <div>
            <div class="flex justify-between mb-1">
                <label class="text-sm font-medium">环境噪声 (Environment Noise)</label>
                <span id="environment_noise-display" class="text-sm text-purple-400 font-mono">20%</span>
            </div>
            <input type="range" id="environment_noise-slider" data-var="environment_noise" min="0" max="100" value="20" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb">
        </div>

        <div>
            <div class="flex justify-between mb-1">
                <label class="text-sm font-medium">最大循环 (Max Iterations)</label>
                <span id="max_iterations-display" class="text-sm text-purple-400 font-mono">20</span>
            </div>
            <input type="range" id="max_iterations-slider" data-var="max_iterations" min="5" max="50" value="20" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb">
        </div>

        <div>
            <div class="flex justify-between mb-1">
                <label class="text-sm font-medium">纠错能力 (Recovery Rate)</label>
                <span id="error_recovery_rate-display" class="text-sm text-purple-400 font-mono">80%</span>
            </div>
            <input type="range" id="error_recovery_rate-slider" data-var="error_recovery_rate" min="0" max="100" value="80" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb">
        </div>
    </div>

    <!-- 预设按钮 -->
    <div class="grid grid-cols-2 gap-2 mb-6">
        <button onclick="applyPreset('高噪挑战')" class="text-xs bg-slate-700 hover:bg-slate-600 p-2 rounded transition border border-slate-600">高噪挑战</button>
        <button onclick="applyPreset('理想Agent')" class="text-xs bg-slate-700 hover:bg-slate-600 p-2 rounded transition border border-slate-600">理想Agent</button>
    </div>

    <!-- PPA 状态显示 -->
    <div class="bg-slate-900 rounded-lg p-3 mb-6 border border-slate-800">
        <div class="flex justify-around text-center">
            <div id="stage-0" class="loop-stage">
                <div class="text-lg">👁️</div>
                <div class="text-[10px] uppercase">Perceive</div>
            </div>
            <div class="flex items-center text-slate-600">→</div>
            <div id="stage-1" class="loop-stage">
                <div class="text-lg">🧠</div>
                <div class="text-[10px] uppercase">Plan</div>
            </div>
            <div class="flex items-center text-slate-600">→</div>
            <div id="stage-2" class="loop-stage">
                <div class="text-lg">🛠️</div>
                <div class="text-[10px] uppercase">Act</div>
            </div>
        </div>
    </div>

    <!-- 控制按钮 -->
    <div class="mt-auto space-y-2 pb-2">
        <button id="main-btn" onclick="handleMainAction()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold transition-all flex items-center justify-center">
            <span id="btn-icon" class="mr-2">▶</span> <span id="btn-text">启动模拟</span>
        </button>
        <button id="reset-btn" onclick="resetSimulation()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition text-slate-400">
            重置环境
        </button>
    </div>
</div>

<!-- 右侧/底部 画布区域 -->
<div class="flex-1 relative flex flex-col bg-slate-950 overflow-hidden">
    <!-- HUD 信息层 -->
    <div class="absolute top-4 left-4 z-10 pointer-events-none">
        <div class="flex gap-4">
            <div class="bg-black/50 backdrop-blur rounded p-2 px-3 border border-white/10">
                <span class="text-[10px] text-slate-400 uppercase block">Iteration</span>
                <span id="iter-count" class="text-xl font-mono text-purple-400">00</span>
            </div>
            <div class="bg-black/50 backdrop-blur rounded p-2 px-3 border border-white/10">
                <span class="text-[10px] text-slate-400 uppercase block">Distance</span>
                <span id="dist-count" class="text-xl font-mono text-emerald-400">100%</span>
            </div>
        </div>
    </div>

    <!-- 实时日志层 (桌面端显示) -->
    <div class="absolute bottom-4 right-4 z-10 w-64 max-h-40 bg-black/40 backdrop-blur border border-white/5 rounded p-2 hidden md:block">
        <div class="text-[10px] text-slate-500 mb-1 border-bottom border-white/5 uppercase">Agent Thinking...</div>
        <div id="log-container" class="log-container text-[11px] h-32 overflow-y-auto space-y-1">
            <div class="text-slate-400 italic">等待启动...</div>
        </div>
    </div>

    <!-- 画布容器 -->
    <div id="canvas-container" class="flex-1 w-full h-full">
        <canvas id="sim-canvas"></canvas>
    </div>

    <!-- 结束提示层 -->
    <div id="overlay" class="absolute inset-0 bg-black/70 z-40 hidden flex items-center justify-center pointer-events-none">
        <div class="text-center animate-bounce">
            <h2 id="overlay-title" class="text-3xl font-bold mb-2 text-white">任务达成</h2>
            <p id="overlay-desc" class="text-slate-400">Agent 成功完成目标循环</p>
        </div>
    </div>
</div>

<script>
    // --- 状态管理 ---
    const state = {
        running: false,
        paused: false,
        ended: false,
        currentIteration: 0,
        loopStage: -1, // -1: Ready, 0: Perceive, 1: Plan, 2: Act
        
        agent: { x: 50, y: 0, targetX: 50, targetY: 0, realX: 0, realY: 0 },
        target: { x: 0, y: 0 },
        
        config: {
            environment_noise: 20,
            max_iterations: 20,
            error_recovery_rate: 80
        },
        
        path: [],
        lastUpdateTime: 0,
        cycleTimer: 0
    };

    // --- 初始化 Canvas ---
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        initPositions();
        draw();
    }

    window.addEventListener('resize', resize);
    
    function initPositions() {
        const padding = 60;
        state.agent.realX = padding;
        state.agent.realY = canvas.height / 2;
        state.agent.x = state.agent.realX;
        state.agent.y = state.agent.realY;
        
        state.target.x = canvas.width - padding;
        state.target.y = canvas.height / 2;
        
        state.path = [{x: state.agent.realX, y: state.agent.realY}];
    }

    // --- 逻辑函数 ---

    function handleMainAction() {
        if (state.ended) {
            resetSimulation();
            startSimulation();
        } else if (state.running) {
            pauseSimulation();
        } else {
            startSimulation();
        }
    }

    function startSimulation() {
        state.running = true;
        state.paused = false;
        state.ended = false;
        updateUI();
        addLog("▶ 循环启动: Agent 进入主动运行状态");
        requestAnimationFrame(loop);
    }

    function pauseSimulation() {
        state.running = false;
        state.paused = true;
        updateUI();
        addLog("⏸ 模拟暂停");
    }

    function resetSimulation() {
        state.running = false;
        state.paused = false;
        state.ended = false;
        state.currentIteration = 0;
        state.loopStage = -1;
        state.cycleTimer = 0;
        initPositions();
        updateUI();
        document.getElementById('log-container').innerHTML = '<div class="text-slate-400 italic">环境已重置</div>';
        document.getElementById('overlay').classList.add('hidden');
        draw();
    }

    function applyPreset(name) {
        const config = document.getElementById('widget-config').textContent;
        const presets = JSON.parse(config).presets;
        const preset = presets.find(p => p.name === name);
        if (preset) {
            Object.entries(preset.variables).forEach(([key, val]) => {
                state.config[key] = val;
                const slider = document.getElementById(key + '-slider');
                if (slider) slider.value = val;
                const display = document.getElementById(key + '-display');
                if (display) display.textContent = val + (key.includes('noise') || key.includes('rate') ? '%' : '');
            });
            resetSimulation();
        }
    }

    function addLog(msg, type = 'info') {
        const log = document.getElementById('log-container');
        const entry = document.createElement('div');
        const color = type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : 'text-slate-300';
        entry.className = `${color} border-l-2 border-slate-700 pl-2 py-0.5 fade-in`;
        entry.textContent = `[Step ${state.currentIteration}] ${msg}`;
        log.prepend(entry);
    }

    // --- 变量交互 ---
    document.querySelectorAll('input[type="range"]').forEach(slider => {
        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            const key = e.target.dataset.var;
            state.config[key] = val;
            document.getElementById(`${key}-display`).textContent = val + (key.includes('noise') || key.includes('rate') ? '%' : '');
            if (!state.running) draw();
        });
    });

    // --- 核心模拟逻辑 ---
    
    function loop(timestamp) {
        if (!state.running || state.paused) return;

        const dt = timestamp - state.lastUpdateTime;
        state.lastUpdateTime = timestamp;

        if (state.cycleTimer <= 0) {
            processNextStage();
            // 每个阶段持续时长：1000ms
            state.cycleTimer = 1000;
        } else {
            state.cycleTimer -= dt;
        }

        draw();
        requestAnimationFrame(loop);
    }

    function processNextStage() {
        state.loopStage = (state.loopStage + 1) % 3;
        
        if (state.loopStage === 0) {
            state.currentIteration++;
            if (state.currentIteration > state.config.max_iterations) {
                endSimulation(false);
                return;
            }
        }

        switch(state.loopStage) {
            case 0: // Perceive
                const noise = (Math.random() - 0.5) * state.config.environment_noise * 2;
                state.agent.perceivedTargetY = state.target.y + noise;
                addLog(`感知: 获取环境反馈... 噪声干扰 ±${state.config.environment_noise}%`);
                break;
            case 1: // Plan
                const distTotal = state.target.x - state.agent.realX;
                const stepSize = distTotal / (state.config.max_iterations - state.currentIteration + 1);
                state.agent.plannedNextX = state.agent.realX + stepSize;
                state.agent.plannedNextY = state.agent.perceivedTargetY;
                
                // 模拟回溯或纠错
                if (Math.random() * 100 > state.config.error_recovery_rate) {
                    state.agent.plannedNextY += (Math.random() - 0.5) * 50;
                    addLog("规划: 逻辑推理中... 检视目标时出现预测偏差", "error");
                } else {
                    addLog("规划: 路径计算中... 拟定下一组工具调用参数");
                }
                break;
            case 2: // Act
                state.agent.realX = state.agent.plannedNextX;
                state.agent.realY = state.agent.plannedNextY;
                state.path.push({x: state.agent.realX, y: state.agent.realY});
                addLog("行动: 执行工具调用 (Call Tools) 并更新状态", "success");
                
                // 检查是否到达
                const distToGoal = Math.hypot(state.target.x - state.agent.realX, state.target.y - state.agent.realY);
                if (distToGoal < 20) {
                    endSimulation(true);
                }
                break;
        }
        updateUI();
    }

    function endSimulation(success) {
        state.running = false;
        state.ended = true;
        updateUI();
        
        const overlay = document.getElementById('overlay');
        const title = document.getElementById('overlay-title');
        const desc = document.getElementById('overlay-desc');
        
        overlay.classList.remove('hidden');
        overlay.style.pointerEvents = 'auto';
        
        if (success) {
            title.textContent = "任务达成";
            title.className = "text-3xl font-bold mb-2 text-emerald-400";
            desc.textContent = `Agent 在第 ${state.currentIteration} 轮循环成功完成目标`;
            addLog("🎉 任务成功完成！", "success");
        } else {
            title.textContent = "任务终止";
            title.className = "text-3xl font-bold mb-2 text-red-400";
            desc.textContent = "超出最大迭代次数，Agent 停止运行";
            addLog("❌ 任务超时终止", "error");
        }
    }

    function updateUI() {
        // 更新按钮
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const mainBtn = document.getElementById('main-btn');

        if (state.ended) {
            btnText.textContent = "重新开始";
            btnIcon.textContent = "🔄";
            mainBtn.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold transition-all flex items-center justify-center";
        } else if (state.running) {
            btnText.textContent = "暂停模拟";
            btnIcon.textContent = "⏸";
            mainBtn.className = "w-full py-3 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold transition-all flex items-center justify-center";
        } else {
            btnText.textContent = "启动模拟";
            btnIcon.textContent = "▶";
            mainBtn.className = "w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold transition-all flex items-center justify-center";
        }

        // 更新计数器
        document.getElementById('iter-count').textContent = state.currentIteration.toString().padStart(2, '0');
        const d = Math.max(0, Math.round((1 - (state.agent.realX / state.target.x)) * 100));
        document.getElementById('dist-count').textContent = d + '%';

        // 更新循环阶段高亮
        for(let i=0; i<3; i++) {
            const el = document.getElementById(`stage-${i}`);
            if (state.loopStage === i) el.classList.add('active');
            else el.classList.remove('active');
        }
    }

    // --- 绘制渲染 ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. 绘制网格
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        const gridSize = 40;
        for(let x=0; x<canvas.width; x+=gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y=0; y<canvas.height; y+=gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 2. 绘制路径
        if (state.path.length > 1) {
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
            ctx.lineWidth = 2;
            ctx.moveTo(state.path[0].x, state.path[0].y);
            for(let i=1; i<state.path.length; i++) {
                ctx.lineTo(state.path[i].x, state.path[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 3. 绘制目标
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(252, 211, 77, 0.5)';
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(state.target.x, state.target.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 目标装饰圈
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
        ctx.beginPath();
        ctx.arc(state.target.x, state.target.y, 15 + Math.sin(Date.now()/300)*5, 0, Math.PI * 2);
        ctx.stroke();

        // 4. 绘制感知范围 (Perceive Stage)
        if (state.loopStage === 0 && state.running) {
            ctx.fillStyle = 'rgba(139, 92, 246, 0.1)';
            ctx.beginPath();
            ctx.moveTo(state.agent.realX, state.agent.realY);
            ctx.lineTo(state.target.x, state.target.y - 40);
            ctx.lineTo(state.target.x, state.target.y + 40);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.5)';
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(state.agent.realX, state.agent.realY);
            ctx.lineTo(state.target.x, state.agent.perceivedTargetY);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 5. 绘制规划线路 (Plan Stage)
        if (state.loopStage === 1 && state.running) {
            ctx.strokeStyle = '#a78bfa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(state.agent.realX, state.agent.realY);
            ctx.lineTo(state.agent.plannedNextX, state.agent.plannedNextY);
            ctx.stroke();
            
            // 绘制规划终点的虚影
            ctx.fillStyle = 'rgba(167, 139, 250, 0.5)';
            ctx.beginPath();
            ctx.arc(state.agent.plannedNextX, state.agent.plannedNextY, 5, 0, Math.PI*2);
            ctx.fill();
        }

        // 6. 绘制 Agent
        const agentX = state.agent.realX;
        const agentY = state.agent.realY;
        
        // 发光外圈
        const gradient = ctx.createRadialGradient(agentX, agentY, 2, agentX, agentY, 15);
        gradient.addColorStop(0, 'rgba(139, 92, 246, 1)');
        gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(agentX, agentY, 15, 0, Math.PI * 2);
        ctx.fill();

        // 实体核心
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(agentX, agentY, 6, 0, Math.PI * 2);
        ctx.fill();
        
        // 眼睛
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(agentX + 2, agentY - 1, 1.5, 0, Math.PI * 2);
        ctx.arc(agentX + 2, agentY + 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // --- 消息监听器 ---
    window.addEventListener('message', function(event) {
        const { type, target, state: newState, content } = event.data;

        switch (type) {
            case 'SET_WIDGET_STATE':
                if (newState) {
                    Object.entries(newState).forEach(([key, value]) => {
                        const slider = document.getElementById(key + '-slider');
                        if (slider) {
                            slider.value = value;
                            slider.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    });
                }
                break;

            case 'HIGHLIGHT_ELEMENT':
                const highlightEl = document.querySelector(target);
                if (highlightEl) {
                    highlightEl.style.outline = '3px solid rgba(139, 92, 246, 0.8)';
                    highlightEl.style.outlineOffset = '4px';
                    highlightEl.style.animation = 'pulse-highlight 2s infinite';
                    setTimeout(() => {
                        highlightEl.style.outline = '';
                        highlightEl.style.animation = '';
                    }, 3000);
                }
                break;

            case 'ANNOTATE_ELEMENT':
                const annotateEl = document.querySelector(target);
                if (annotateEl && content) {
                    const rect = annotateEl.getBoundingClientRect();
                    const tooltip = document.createElement('div');
                    tooltip.className = 'teacher-annotation';
                    tooltip.style.cssText = 'position:fixed; top:' + (rect.top - 40) + 'px; left:' + rect.left + 'px; background:rgba(139,92,246,0.95); color:white; padding:8px 12px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s;';
                    tooltip.textContent = content;
                    document.body.appendChild(tooltip);
                    setTimeout(() => tooltip.remove(), 4000);
                }
                break;
        }
    });

    // 键盘支持
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            handleMainAction();
        } else if (e.code === 'KeyR') {
            resetSimulation();
        }
    });

    // 启动初始化
    resize();
    updateUI();
</script>
</body>
</html>
