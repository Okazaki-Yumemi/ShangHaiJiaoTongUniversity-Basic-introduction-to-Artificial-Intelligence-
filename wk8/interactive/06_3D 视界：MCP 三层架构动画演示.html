<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 三层架构动画演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: white;
    }
    #canvas-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; }

    #loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
    }
    .label-box {
      background: rgba(10, 10, 30, 0.8);
      border-left: 4px solid #6366f1;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 10px;
      backdrop-filter: blur(4px);
    }
    .label-box h2 { font-size: 18px; color: #fbbf24; margin-bottom: 4px; }
    .label-box p { font-size: 14px; color: #ccc; }

    #json-payload {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 260px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #333;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 8px;
      display: none;
      color: #4ade80;
      white-space: pre-wrap;
    }

    #controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(20, 20, 35, 0.95);
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
    }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    button {
      padding: 0 20px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover { background: #444; }
    button:active { transform: scale(0.95); }
    button.primary { background: #6366f1; }
    button.primary:hover { background: #5558e8; }
    button.pulse-active { background: #f59e0b; }

    .zoom-btns { display: flex; gap: 8px; }
    .zoom-btns button { width: 44px; padding: 0; font-size: 20px; }

    #status-bar {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(99, 102, 241, 0.2);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(99, 102, 241, 0.5);
      font-size: 14px;
      display: none;
    }

    @media (max-width: 600px) {
      #overlay { display: none; }
      #json-payload { width: 180px; font-size: 10px; }
    }
  </style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const katexOptions = {
        delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false,
        strict: false,
        trust: true
    };

    let renderTimeout;
    function safeRender() {
        if (renderTimeout) clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => {
            renderMathInElement(document.body, katexOptions);
        }, 100);
    }

    renderMathInElement(document.body, katexOptions);

    const observer = new MutationObserver((mutations) => {
        let shouldRender = false;
        mutations.forEach((mutation) => {
            if (mutation.target &&
                mutation.target.className &&
                typeof mutation.target.className === 'string' &&
                mutation.target.className.includes('katex')) {
                return;
            }
            shouldRender = true;
        });

        if (shouldRender) {
            safeRender();
        }
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });

    setInterval(() => {
        const text = document.body.innerText;
        if (text.includes('\\(') || text.includes('$$')) {
            safeRender();
        }
    }, 2000);
});
</script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>正在初始化 MCP 3D 架构场景...</p>
  </div>

  <div id="canvas-container"></div>

  <div id="overlay">
    <div class="label-box">
      <h2>Host (主机)</h2>
      <p>Trae 编辑器: 发起任务目标</p>
    </div>
    <div class="label-box" style="border-left-color: #a855f7;">
      <h2>Client (客户端)</h2>
      <p>MCP Connector: 意图翻译与连接</p>
    </div>
    <div class="label-box" style="border-left-color: #10b981;">
      <h2>Server (服务端)</h2>
      <p>Tools/Resources: 函数执行与数据</p>
    </div>
  </div>

  <div id="json-payload"></div>
  <div id="status-bar">请求传输中...</div>

  <div id="controls">
    <div class="control-group">
      <label>流程控制</label>
      <button id="flow-btn" class="primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        发起 MCP 请求
      </button>
    </div>

    <div class="control-group">
      <label>视图缩放</label>
      <div class="zoom-btns">
        <button id="zoom-in-btn" title="放大">+</button>
        <button id="zoom-out-btn" title="缩小">−</button>
      </div>
    </div>

    <div class="control-group">
      <label>视角</label>
      <button id="reset-btn">重置视角</button>
    </div>

    <div class="control-group">
      <label>动画速度</label>
      <input type="range" id="speed-slider" min="0.2" max="3" step="0.1" value="1" style="width: 100px;">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Global state
    const state = {
      isFlowing: false,
      flowProgress: 0,
      animationSpeed: 1,
      objects: {}
    };

    async function initScene() {
      try {
        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 20, 50);

        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
        camera.position.set(0, 12, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- Create Architecture Objects ---

        // Grid Ground
        const grid = new THREE.GridHelper(100, 50, 0x222244, 0x111122);
        grid.position.y = -2;
        scene.add(grid);

        // 1. Host (Trae IDE)
        const hostGroup = new THREE.Group();
        const hostGeom = new THREE.BoxGeometry(4, 5, 1);
        const hostMat = new THREE.MeshPhongMaterial({ 
          color: 0x6366f1, 
          transparent: true, 
          opacity: 0.8,
          emissive: 0x111144
        });
        const hostCube = new THREE.Mesh(hostGeom, hostMat);
        hostGroup.add(hostCube);
        
        // Host Screen Detail
        const screenGeom = new THREE.PlaneGeometry(3.5, 4.5);
        const screenMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const screen = new THREE.Mesh(screenGeom, screenMat);
        screen.position.z = 0.51;
        hostGroup.add(screen);
        
        hostGroup.position.set(-12, 1, 0);
        scene.add(hostGroup);
        state.objects.Host_UI_Cube = hostGroup;

        // 2. Client (Bridge)
        const clientGroup = new THREE.Group();
        const ringGeom = new THREE.TorusGeometry(2, 0.1, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0xa855f7, emissiveIntensity: 0.5 });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.rotation.x = Math.PI / 2;
        clientGroup.add(ring);
        
        const coreGeom = new THREE.SphereGeometry(0.8, 32, 32);
        const coreMat = new THREE.MeshPhongMaterial({ color: 0xec4899, emissive: 0x330033 });
        const core = new THREE.Mesh(coreGeom, coreMat);
        clientGroup.add(core);

        clientGroup.position.set(0, 1, 0);
        scene.add(clientGroup);
        state.objects.Client_Bridge_Layer = clientGroup;

        // 3. Server (Cylinder)
        const serverGroup = new THREE.Group();
        const serverGeom = new THREE.CylinderGeometry(2, 2, 6, 32);
        const serverMat = new THREE.MeshPhongMaterial({ color: 0x10b981, transparent: true, opacity: 0.7 });
        const server = new THREE.Mesh(serverGeom, serverMat);
        serverGroup.add(server);
        
        // Add glowing bands
        for(let i = 0; i < 3; i++) {
          const bandGeom = new THREE.CylinderGeometry(2.05, 2.05, 0.2, 32);
          const bandMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 });
          const band = new THREE.Mesh(bandGeom, bandMat);
          band.position.y = -2 + (i * 2);
          serverGroup.add(band);
          state.objects[`Server_Band_${i}`] = band;
        }

        serverGroup.position.set(12, 1, 0);
        scene.add(serverGroup);
        state.objects.Server_Database_Cylinder = serverGroup;

        // 4. Data Pulse
        const pulseGeom = new THREE.SphereGeometry(0.4, 16, 16);
        const pulseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pulse = new THREE.Mesh(pulseGeom, pulseMat);
        pulse.visible = false;
        scene.add(pulse);
        state.objects.Data_Pulse_Sphere = pulse;

        // 5. Connecting Lines (Paths)
        const lineMat = new THREE.LineDashedMaterial({ color: 0x444466, dashSize: 0.5, gapSize: 0.2 });
        
        const createPath = (start, end) => {
          const points = [new THREE.Vector3(...start), new THREE.Vector3(...end)];
          const geom = new THREE.BufferGeometry().setFromPoints(points);
          const line = new THREE.Line(geom, lineMat);
          line.computeLineDistances();
          scene.add(line);
          return line;
        };

        createPath([-10, 1, 0], [-2, 1, 0]);
        createPath([2, 1, 0], [10, 1, 0]);

        // --- Interaction Logic ---

        const payloadEl = document.getElementById('json-payload');
        const statusEl = document.getElementById('status-bar');

        const payloads = {
          request: `{
  "jsonrpc": "2.0",
  "method": "tools/call",
  "params": {
    "name": "get_weather",
    "arguments": { "city": "Beijing" }
  }
}`,
          response: `{
  "jsonrpc": "2.0",
  "result": {
    "content": [
      { "type": "text", "text": "25°C, Sunny" }
    ]
  }
}`
        };

        function triggerRequestFlow() {
          if (state.isFlowing) return;
          state.isFlowing = true;
          state.flowProgress = 0;
          pulse.visible = true;
          document.getElementById('flow-btn').disabled = true;
          document.getElementById('flow-btn').classList.add('pulse-active');
          statusEl.style.display = 'block';
        }

        document.getElementById('flow-btn').addEventListener('click', triggerRequestFlow);

        document.getElementById('zoom-in-btn').addEventListener('click', () => {
          camera.position.z -= 3;
        });

        document.getElementById('zoom-out-btn').addEventListener('click', () => {
          camera.position.z += 3;
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
          camera.position.set(0, 12, 25);
          controls.target.set(0, 0, 0);
          state.animationSpeed = 1;
          document.getElementById('speed-slider').value = 1;
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
          state.animationSpeed = parseFloat(e.target.value);
        });

        // --- Animation Loop ---

        function animate() {
          requestAnimationFrame(animate);
          
          const time = performance.now() * 0.001;

          // Gentle rotations
          hostGroup.rotation.y = Math.sin(time * 0.5) * 0.1;
          clientGroup.rotation.y += 0.01 * state.animationSpeed;
          serverGroup.rotation.y = Math.cos(time * 0.5) * 0.1;

          // Pulse movement logic
          if (state.isFlowing) {
            state.flowProgress += 0.005 * state.animationSpeed;

            if (state.flowProgress < 0.25) {
              // Host to Client
              const t = state.flowProgress / 0.25;
              pulse.position.lerpVectors(new THREE.Vector3(-10, 1, 0), new THREE.Vector3(-2, 1, 0), t);
              statusEl.innerText = "Host 正在发送原始意图...";
              payloadEl.style.display = 'none';
            } 
            else if (state.flowProgress < 0.4) {
              // Processing at Client
              pulse.position.set(0, 1, 0);
              pulse.scale.setScalar(1 + Math.sin(time * 10) * 0.5);
              statusEl.innerText = "Client 翻译意图为 MCP JSON-RPC";
              payloadEl.style.display = 'block';
              payloadEl.innerText = payloads.request;
            }
            else if (state.flowProgress < 0.65) {
              // Client to Server
              const t = (state.flowProgress - 0.4) / 0.25;
              pulse.position.lerpVectors(new THREE.Vector3(2, 1, 0), new THREE.Vector3(10, 1, 0), t);
              statusEl.innerText = "请求传输至 Server 端执行工具";
              pulse.scale.setScalar(1);
            }
            else if (state.flowProgress < 0.75) {
              // Processing at Server
              pulse.position.set(12, 1, 0);
              statusEl.innerText = "Server 工具执行成功，返回数据";
              payloadEl.innerText = payloads.response;
            }
            else if (state.flowProgress < 1.0) {
              // Server back to Client
              const t = (state.flowProgress - 0.75) / 0.25;
              pulse.position.lerpVectors(new THREE.Vector3(10, 1, 0), new THREE.Vector3(0, 1, 0), t);
            }
            else if (state.flowProgress < 1.2) {
              // Final stretch back to Host
              const t = (state.flowProgress - 1.0) / 0.2;
              pulse.position.lerpVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-10, 1, 0), t);
              statusEl.innerText = "结果返回 Host 界面展示";
            }
            else {
              // Reset
              state.isFlowing = false;
              pulse.visible = false;
              document.getElementById('flow-btn').disabled = false;
              document.getElementById('flow-btn').classList.remove('pulse-active');
              statusEl.style.display = 'none';
              payloadEl.style.display = 'none';
            }
          }

          controls.update();
          renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });

        document.getElementById('loading').style.display = 'none';

      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `<p style="color:#ff6b6b">初始化失败: ${err.message}</p>`;
      }
    }

    // Teacher Actions Listener
    window.addEventListener('message', (event) => {
      const { action, payload } = event.data;
      if (!action) return;

      switch (action) {
        case 'SET_WIDGET_STATE': {
          if (payload.speed) state.animationSpeed = payload.speed;
          if (payload.triggerFlow) document.getElementById('flow-btn').click();
          break;
        }
        case 'HIGHLIGHT_ELEMENT': {
          const { elementId, highlight } = payload;
          const target = state.objects[elementId];
          if (target) {
            target.traverse(obj => {
              if (obj.material && obj.material.emissive) {
                obj.material.emissive.set(highlight ? 0xffff00 : 0x000000);
              }
            });
          }
          break;
        }
        case 'ANNOTATE_ELEMENT': {
          const { elementId, text } = payload;
          const statusEl = document.getElementById('status-bar');
          statusEl.style.display = 'block';
          statusEl.innerText = text;
          setTimeout(() => statusEl.style.display = 'none', 3000);
          break;
        }
      }
    });

    initScene();
  </script>

  <script type="application/json" id="widget-config">
  {
    "type": "visualization3d",
    "visualizationType": "custom",
    "description": "MCP 三层架构（Host, Client, Server）交互演示",
    "objects": [
      { "id": "Host_UI_Cube", "label": "Host (Trae)" },
      { "id": "Client_Bridge_Layer", "label": "Client (MCP Connector)" },
      { "id": "Server_Database_Cylinder", "label": "Server (Tools)" },
      { "id": "Data_Pulse_Sphere", "label": "数据脉冲" }
    ],
    "interactions": [
      { "type": "button", "action": "trigger_request_flow", "label": "发起请求" },
      { "type": "slider", "param": "speed", "min": 0.5, "max": 3, "default": 1 },
      { "type": "orbit", "target": "camera" }
    ],
    "presets": [
      { "name": "标准架构视图", "state": { "cameraPosition": [0, 12, 25] } },
      { "name": "专注 Server 侧", "state": { "cameraPosition": [15, 5, 10] } }
    ]
  }
  </script>
</body>
</html>
