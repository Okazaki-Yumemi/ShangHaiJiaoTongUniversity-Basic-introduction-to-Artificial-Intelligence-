<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skill On-Demand Loading Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #ddd6fe;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas {
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .control-panel {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-primary {
            background-color: var(--primary);
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .token-bar-bg {
            background: #334155;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .token-bar-fill {
            height: 100%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .skill-node {
            transition: all 0.3s;
        }

        @keyframes pulse-highlight {
            0%, 100% { outline-color: rgba(139, 92, 246, 0.8); }
            50% { outline-color: rgba(139, 92, 246, 0.4); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .control-panel {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                max-height: 45vh;
            }
        }
    </style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const katexOptions = {
        delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false,
        strict: false,
        trust: true
    };

    let renderTimeout;
    function safeRender() {
        if (renderTimeout) clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => {
            renderMathInElement(document.body, katexOptions);
        }, 100);
    }

    renderMathInElement(document.body, katexOptions);

    const observer = new MutationObserver((mutations) => {
        let shouldRender = false;
        mutations.forEach((mutation) => {
            if (mutation.target &&
                mutation.target.className &&
                typeof mutation.target.className === 'string' &&
                mutation.target.className.includes('katex')) {
                return;
            }
            shouldRender = true;
        });

        if (shouldRender) {
            safeRender();
        }
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });

    setInterval(() => {
        const text = document.body.innerText;
        if (text.includes('\\(') || text.includes('$$')) {
            safeRender();
        }
    }, 2000);
});
</script>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Embedded Widget Configuration -->
    <script type="application/json" id="widget-config">
    {
      "type": "simulation",
      "concept": "skill_on_demand_loading",
      "description": "演示 Skills 按需加载机制如何在高并发 Agent 场景下节省 Token 并提升响应速度。",
      "variables": [
        { "name": "skill_library_size", "label": "技能库规模 (Skills)", "min": 10, "max": 100, "default": 40, "unit": "" },
        { "name": "context_window_limit", "label": "上下文上限 (Tokens)", "min": 2000, "max": 16000, "default": 8000, "unit": "" },
        { "name": "retrieval_threshold", "label": "检索召回阈值", "min": 0, "max": 1, "default": 0.7, "step": 0.1, "unit": "" }
      ],
      "presets": [
        { "name": "全能型全量加载", "variables": { "skill_library_size": 20, "retrieval_threshold": 0.0, "context_window_limit": 10000 } },
        { "name": "高效率按需加载", "variables": { "skill_library_size": 80, "retrieval_threshold": 0.8, "context_window_limit": 8000 } }
      ]
    }
    </script>

    <!-- Sidebar Controls -->
    <div id="controls" class="control-panel w-full md:w-80 p-6 flex flex-col gap-6 overflow-y-auto shrink-0">
        <div>
            <h1 class="text-xl font-bold mb-2 flex items-center gap-2">
                <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                Skills 按需加载
            </h1>
            <p class="text-xs text-slate-400">对比 Full Load vs On-Demand 性能差异</p>
        </div>

        <div class="space-y-4">
            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <label>技能库规模</label>
                    <span id="skill_library_size-display" class="font-mono text-purple-400">40</span>
                </div>
                <input type="range" id="skill_library_size-slider" data-var="skill_library_size" min="10" max="100" value="40" class="w-full">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <label>上下文上限 (Tokens)</label>
                    <span id="context_window_limit-display" class="font-mono text-purple-400">8000</span>
                </div>
                <input type="range" id="context_window_limit-slider" data-var="context_window_limit" min="2000" max="16000" value="8000" step="100" class="w-full">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <label>检索相关性阈值</label>
                    <span id="retrieval_threshold-display" class="font-mono text-purple-400">0.7</span>
                </div>
                <input type="range" id="retrieval_threshold-slider" data-var="retrieval_threshold" min="0" max="0.9" step="0.1" value="0.7" class="w-full">
            </div>
        </div>

        <div class="pt-4 space-y-3">
            <button id="main-btn" class="btn-primary w-full py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                <span>启动模拟</span>
            </button>
            <button id="reset-btn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition-colors">
                重置
            </button>
        </div>

        <div class="mt-auto bg-slate-800/50 p-4 rounded-xl space-y-3 border border-slate-700">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">实时 Token 占用对比</div>
            <div class="space-y-2">
                <div class="flex justify-between text-[10px]">
                    <span>按需加载 (On-Demand)</span>
                    <span id="current-tokens" class="font-mono">0 Tkn</span>
                </div>
                <div class="token-bar-bg">
                    <div id="token-bar-active" class="token-bar-fill bg-green-500" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[10px] mt-1">
                    <span>全量加载 (Full Load)</span>
                    <span id="full-tokens" class="font-mono">0 Tkn</span>
                </div>
                <div class="token-bar-bg">
                    <div id="token-bar-full" class="token-bar-fill bg-red-500/40" style="width: 0%"></div>
                </div>
            </div>
            <div id="saving-pct" class="text-center text-green-400 text-sm font-bold pt-1">
                节省比例: 0%
            </div>
        </div>
    </div>

    <!-- Main Visualizer -->
    <div class="flex-1 relative flex flex-col overflow-hidden bg-[#020617]">
        <!-- Task Indicator -->
        <div id="task-card" class="absolute top-6 left-1/2 -translate-x-1/2 bg-white/5 border border-white/10 backdrop-blur-md px-6 py-3 rounded-2xl z-20 opacity-0 transition-all duration-500">
            <div class="text-xs text-slate-400">当前任务需求</div>
            <div id="task-text" class="text-lg font-bold text-white tracking-wide italic">"编写一段 Python 代码..."</div>
        </div>

        <canvas id="sim-canvas"></canvas>

        <!-- Status HUD -->
        <div class="absolute bottom-6 right-6 flex flex-col gap-2 items-end">
            <div id="status-tag" class="px-3 py-1 bg-slate-800 rounded-full text-[10px] border border-slate-700 text-slate-400 uppercase tracking-widest">
                IDLE
            </div>
        </div>
    </div>

    <script>
        // Simulation State
        const state = {
            running: false,
            paused: false,
            ended: false,
            skill_library_size: 40,
            context_window_limit: 8000,
            retrieval_threshold: 0.7,
            skills: [],
            activeSkillIndices: [],
            particles: [],
            timer: 0,
            phase: 'IDLE', // IDLE, SCANNING, LOADING, EXECUTING
            task: "",
            fullLoadTokens: 0,
            onDemandTokens: 0
        };

        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        const mainBtn = document.getElementById('main-btn');
        const resetBtn = document.getElementById('reset-btn');
        const taskCard = document.getElementById('task-card');
        const taskText = document.getElementById('task-text');

        const TASKS = [
            { text: "编写数学公式推导代码", tags: ['math', 'code'] },
            { text: "翻译这份法律合同", tags: ['translate', 'law'] },
            { text: "分析近期的股市趋势", tags: ['finance', 'search'] },
            { text: "生成一张精美的人物插画", tags: ['draw', 'art'] },
            { text: "检查这段 SQL 的性能瓶颈", tags: ['database', 'code'] }
        ];

        const SKILL_TYPES = ['code', 'math', 'translate', 'law', 'finance', 'search', 'draw', 'art', 'database', 'logic'];

        // Initial setup
        function init() {
            window.addEventListener('resize', resize);
            resize();
            createSkills();
            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function createSkills() {
            state.skills = [];
            const cols = 8;
            const padding = 15;
            const startX = 60;
            const startY = 140;
            const spacing = (Math.min(canvas.width/window.devicePixelRatio, 600) - 100) / cols;

            for (let i = 0; i < state.skill_library_size; i++) {
                const type = SKILL_TYPES[i % SKILL_TYPES.length];
                state.skills.push({
                    id: i,
                    type: type,
                    x: startX + (i % cols) * spacing,
                    y: startY + Math.floor(i / cols) * 45,
                    active: false,
                    targetX: 0,
                    targetY: 0,
                    opacity: 1,
                    tokenSize: 300 + Math.random() * 500
                });
            }
            state.fullLoadTokens = state.skills.reduce((acc, s) => acc + s.tokenSize, 0);
        }

        // Main Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function update() {
            if (!state.running || state.paused) return;

            state.timer++;

            // Phase Management
            if (state.phase === 'IDLE') {
                startNewTask();
            } else if (state.phase === 'SCANNING') {
                if (state.timer > 60) {
                    state.phase = 'LOADING';
                    state.timer = 0;
                    identifyRelevantSkills();
                }
            } else if (state.phase === 'LOADING') {
                if (state.timer > 100) {
                    state.phase = 'EXECUTING';
                    state.timer = 0;
                }
            } else if (state.phase === 'EXECUTING') {
                if (state.timer > 120) {
                    state.phase = 'IDLE';
                    state.timer = 0;
                }
            }

            // Update Particles
            state.particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.01;
                if (p.life <= 0) state.particles.splice(index, 1);
            });
        }

        function startNewTask() {
            const taskObj = TASKS[Math.floor(Math.random() * TASKS.length)];
            state.task = taskObj;
            taskText.innerText = `"${taskObj.text}"`;
            taskCard.style.opacity = '1';
            taskCard.style.transform = 'translate(-50%, 0)';
            state.phase = 'SCANNING';
            state.timer = 0;
            state.activeSkillIndices = [];
            state.onDemandTokens = 0;
            state.skills.forEach(s => s.active = false);
            updateStatusTag('SCANNING...');
        }

        function identifyRelevantSkills() {
            state.onDemandTokens = 1200; // Base system prompt tokens
            state.skills.forEach((skill, idx) => {
                const isRelevant = state.task.tags.includes(skill.type) || (Math.random() > state.retrieval_threshold);
                if (isRelevant) {
                    skill.active = true;
                    state.activeSkillIndices.push(idx);
                    state.onDemandTokens += skill.tokenSize;
                    // Create particles
                    for(let i=0; i<5; i++) {
                        state.particles.push({
                            x: skill.x, y: skill.y,
                            vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                            life: 1, color: '#8b5cf6'
                        });
                    }
                }
            });
            updateStatsUI();
            updateStatusTag('LOADING SKILLS');
        }

        function draw() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);

            // Draw Background Grids
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<w; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
            for(let j=0; j<h; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }

            // Draw Library Area Label
            ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillText('SKILL LIBRARY (MANDATORY MODULES)', 60, 120);

            // Draw Skills
            state.skills.forEach(skill => {
                const isSelected = skill.active && (state.phase === 'LOADING' || state.phase === 'EXECUTING');
                
                // Skill box
                ctx.beginPath();
                ctx.roundRect(skill.x - 15, skill.y - 15, 30, 30, 6);
                ctx.fillStyle = isSelected ? 'rgba(139, 92, 246, 0.8)' : 'rgba(30, 41, 59, 0.6)';
                ctx.fill();
                ctx.strokeStyle = isSelected ? '#a78bfa' : 'rgba(255,255,255,0.1)';
                ctx.stroke();

                // Skill Type Initials
                ctx.fillStyle = isSelected ? '#fff' : '#64748b';
                ctx.font = '9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(skill.type.substring(0,3).toUpperCase(), skill.x, skill.y + 4);

                // Scanning beam
                if (state.phase === 'SCANNING') {
                    const scanY = 130 + (state.timer % 60) * 4;
                    if (Math.abs(skill.y - scanY) < 20) {
                        ctx.fillStyle = 'rgba(139, 92, 246, 0.2)';
                        ctx.fillRect(skill.x - 15, skill.y - 15, 30, 30);
                    }
                }
            });

            // Draw Context Area (The "Brain")
            const brainX = w / 2;
            const brainY = h - 100;
            
            // Draw Brain Hub
            ctx.beginPath();
            ctx.arc(brainX, brainY, 40, 0, Math.PI * 2);
            ctx.fillStyle = state.phase === 'EXECUTING' ? 'rgba(139, 92, 246, 0.3)' : 'rgba(30, 41, 59, 0.5)';
            ctx.fill();
            ctx.strokeStyle = state.phase === 'EXECUTING' ? '#8b5cf6' : 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 10px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('CONTEXT (LLM)', brainX, brainY + 60);

            // Draw Loading Animation (Skills moving to brain)
            if (state.phase === 'LOADING' || state.phase === 'EXECUTING') {
                state.skills.forEach(skill => {
                    if (skill.active) {
                        const progress = Math.min(1, state.timer / 40);
                        const curX = skill.x + (brainX - skill.x) * (state.phase === 'LOADING' ? progress : 1);
                        const curY = skill.y + (brainY - skill.y) * (state.phase === 'LOADING' ? progress : 1);
                        
                        ctx.beginPath();
                        ctx.moveTo(skill.x, skill.y);
                        ctx.lineTo(curX, curY);
                        ctx.strokeStyle = 'rgba(139, 92, 246, 0.1)';
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(curX, curY, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#8b5cf6';
                        ctx.fill();
                    }
                });
            }

            // Draw Particles
            state.particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(139, 92, 246, ${p.life})`;
                ctx.fill();
            });

            if (state.phase === 'EXECUTING') {
                updateStatusTag('EXECUTING...');
                // Draw processing rings
                ctx.beginPath();
                ctx.arc(brainX, brainY, 40 + Math.sin(Date.now()/200)*5, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(139, 92, 246, 0.5)';
                ctx.stroke();
            }
        }

        function updateStatusTag(text) {
            document.getElementById('status-tag').innerText = text;
        }

        function updateStatsUI() {
            const saving = ((state.fullLoadTokens - state.onDemandTokens) / state.fullLoadTokens * 100).toFixed(1);
            
            document.getElementById('current-tokens').innerText = `${Math.floor(state.onDemandTokens)} Tkn`;
            document.getElementById('full-tokens').innerText = `${Math.floor(state.fullLoadTokens)} Tkn`;
            
            const activeWidth = (state.onDemandTokens / state.context_window_limit * 100);
            const fullWidth = (state.fullLoadTokens / state.context_window_limit * 100);
            
            document.getElementById('token-bar-active').style.width = Math.min(100, activeWidth) + '%';
            document.getElementById('token-bar-full').style.width = Math.min(100, fullWidth) + '%';
            
            document.getElementById('saving-pct').innerText = `节省比例: ${saving}%`;
            
            if (activeWidth > 100) {
                document.getElementById('token-bar-active').classList.replace('bg-green-500', 'bg-red-600');
            } else {
                document.getElementById('token-bar-active').classList.replace('bg-red-600', 'bg-green-500');
            }
        }

        // Control Logic
        function toggleSimulation() {
            if (state.ended) {
                resetSimulation();
                state.running = true;
            } else {
                state.running = !state.running;
                state.paused = !state.running;
            }
            updateButtonUI();
        }

        function resetSimulation() {
            state.running = false;
            state.paused = false;
            state.ended = false;
            state.timer = 0;
            state.phase = 'IDLE';
            state.activeSkillIndices = [];
            state.onDemandTokens = 0;
            taskCard.style.opacity = '0';
            createSkills();
            updateStatsUI();
            updateButtonUI();
            updateStatusTag('IDLE');
        }

        function updateButtonUI() {
            if (state.running) {
                mainBtn.innerHTML = '<span>暂停模拟</span>';
                mainBtn.classList.replace('bg-purple-600', 'bg-amber-600');
            } else {
                mainBtn.innerHTML = '<span>启动模拟</span>';
                mainBtn.classList.replace('bg-amber-600', 'bg-purple-600');
            }
        }

        // Event Listeners
        mainBtn.addEventListener('click', toggleSimulation);
        resetBtn.addEventListener('click', resetSimulation);

        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', (e) => {
                const varName = e.target.dataset.var;
                const value = parseFloat(e.target.value);
                state[varName] = value;
                document.getElementById(`${varName}-display`).innerText = value + (varName === 'context_window_limit' ? '' : '');
                
                if (varName === 'skill_library_size') createSkills();
                updateStatsUI();
            });
        });

        // postMessage Listener
        window.addEventListener('message', function(event) {
            const { type, target, state: newState, content } = event.data;
            switch (type) {
                case 'SET_WIDGET_STATE':
                    if (newState) {
                        Object.entries(newState).forEach(([key, value]) => {
                            const slider = document.getElementById(key + '-slider');
                            if (slider) {
                                slider.value = value;
                                slider.dispatchEvent(new Event('input'));
                            }
                        });
                    }
                    break;
                case 'HIGHLIGHT_ELEMENT':
                    const el = document.querySelector(target);
                    if (el) {
                        el.style.outline = '3px solid #8b5cf6';
                        el.style.animation = 'pulse-highlight 2s infinite';
                        setTimeout(() => { el.style.outline = ''; el.style.animation = ''; }, 3000);
                    }
                    break;
            }
        });

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') toggleSimulation();
            if (e.code === 'KeyR') resetSimulation();
        });

        init();
    </script>
</body>
</html>
